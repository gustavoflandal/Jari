; Os quatro serviços do project-jari sob um único supervisor. Logs de todos vão para a saída do contêiner.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:postgres]
command=docker-entrypoint.sh postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rustfs]
command=rustfs /data
priority=20
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:criar-bucket]
command=/usr/local/bin/criar-bucket.sh
priority=25
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 0.0.0.0 --dir /var/lib/redis --appendonly yes --requirepass %(ENV_REDIS_PASSWORD)s
user=redis
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keycloak]
command=/usr/local/bin/iniciar-keycloak.sh
priority=30
autorestart=true
startsecs=0
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
